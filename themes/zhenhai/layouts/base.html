<!DOCTYPE html>
<html lang="{{.Config.Language}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{.Config.Description}}">
<meta name="theme-color" content="#f7f4ef">
<meta name="color-scheme" content="light dark">
<title>{{.Page.Title}}{{if ne .Page.Title .Config.Title}} - {{.Config.Title}}{{end}}</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="stylesheet" href="/assets/css/style.css?v=6">

{{if .Extra.hasMath}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  renderMathInElement(document.body, {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false},
      {left: "\\(", right: "\\)", display: false},
      {left: "\\[", right: "\\]", display: true}
    ]
  });
});
</script>
{{end}}
{{if .Extra.hasMermaid}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
{{end}}

{{if .Config.SEO.GoogleAnalytics}}
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{.Config.SEO.GoogleAnalytics}}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{.Config.SEO.GoogleAnalytics}}');
</script>
{{end}}
</head>
<body>

{{template "header" .}}

<!-- Reading Progress Bar -->
<div id="reading-progress-bar" class="reading-progress-bar"></div>

<!-- Mobile Menu Overlay -->
<div id="mobile-menu-overlay" class="mobile-menu-overlay"></div>
<div id="mobile-menu-panel" class="mobile-menu-panel">
  <button id="mobile-menu-close" class="mobile-menu-close" aria-label="Close menu">&times;</button>
  <nav class="mobile-menu-nav">
    {{range .Config.Menu}}
    <a href="{{.URL}}">{{.Name}}</a>
    {{end}}
  </nav>
</div>

<!-- Search Overlay & Modal -->
<div id="search-overlay" class="search-overlay"></div>
<div id="search-modal" class="search-modal">
  <div class="search-modal-header">
    <span class="search-modal-icon">&#128269;</span>
    <div class="search-modal-input-wrap">
      <input id="search-input" class="search-modal-input" type="text" placeholder="Enter keyword to search..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <span class="search-modal-hint">Ctrl+K</span>
    <button id="search-modal-close" class="search-modal-close" aria-label="Close search">&times;</button>
  </div>
  <div id="search-results" class="search-results">
    <div class="search-empty">Enter keyword to search...</div>
  </div>
</div>

<main class="page-main">
  <div class="content-area">
    {{template "content" .}}
  </div>
  {{template "sidebar" .}}
</main>

{{template "footer" .}}

<script src="/assets/js/main.js"></script>
<script src="/assets/js/search.js"></script>
</body>
</html>
